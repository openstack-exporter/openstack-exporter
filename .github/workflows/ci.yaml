name: ci

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-hadolint@1df92335c6c70880e301926d46148aeb27de1912 # v1.55.0
        with:
          fail_level: any
          filter_mode: nofilter

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-shellcheck@0a90156c6e0553996a217f0a9e09be6b0f6bee4c # v1.34.0
        with:
          fail_level: any
          filter_mode: nofilter

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@1129829fb3230509a1c9aa4e93cec2b234746a68 # v1.78.0
        with:
          fail_level: any
          filter_mode: nofilter

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-markdownlint@a223028b797326efe9d3c9b55e24d740480c3352 # v0.31.2
        with:
          fail_level: any
          filter_mode: nofilter

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: reviewdog/action-golangci-lint@db65103266f304d8ac929ad6c0cd02d14f6837ba # v2.10.1
        with:
          fail_level: any
          filter_mode: nofilter

  build:
    name: Build and test
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CI_USERNAME }}
          password: ${{ secrets.CI_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Read Go version
        id: go-version
        run: echo "version=$(go list -m -f '{{.GoVersion}}')" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Unit tests
        run: |
          mapfile -t packages < <(go list ./... | grep -v '/integration')
          go test -v -covermode=atomic -coverprofile=coverage.out "${packages[@]}"

      - name: Extract metadata from ghcr image
        id: meta-github-image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64, linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-github-image.outputs.tags }}
          labels: ${{ steps.meta-github-image.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}

      - name: Set up Helm
        if: contains(github.ref, 'refs/tags/')
        uses: azure/setup-helm@v5

      - name: Publish Helm chart
        if: contains(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_dir="$(mktemp -d)"
          helm package helmcharts \
            --destination "$package_dir" \
            --version "$version" \
            --app-version "$version"
          helm push "$package_dir/prometheus-openstack-exporter-$version.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      # This step runs ONLY when a tag is pushed
      - name: Run GoReleaser (Tag Release)
        if: contains(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This step runs on anything EXCEPT tags
      - name: Run GoReleaser (Snapshot)
        if: ${{ !contains(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  placement-benchmark:
    name: Placement benchmark
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/env/go-build-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Prepare benchmark cache
        run: mkdir -p "$GOCACHE"

      - name: Run Placement benchmarks
        run: go test ./exporters -bench 'BenchmarkPlacement.*10000' -benchmem -run '^$' -benchtime=1x
