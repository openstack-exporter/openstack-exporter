name: integration-keymanager
on:
  pull_request:
  workflow_dispatch:

jobs:
  integration-keymanager:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "master"
            openstack_version: "master"
            ubuntu_version: "24.04"
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    name: Deploy OpenStack ${{ matrix.name }} with Barbican and run key manager integration tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Deploy devstack
        uses: gophercloud/devstack-action@fc61cc16ba19c4224a70b0b4d7e3e4907fac51e7
        with:
          branch: ${{ matrix.openstack_version }}
          conf_overrides: |
            enable_plugin barbican https://opendev.org/openstack/barbican ${{ matrix.openstack_version }}
          enabled_services: "openstack-cli-server"
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Display clouds.yaml configuration
        run: |
          echo "Contents of /etc/openstack/clouds.yaml:"
          cat /etc/openstack/clouds.yaml || echo "File /etc/openstack/clouds.yaml not found"
      - name: Run OpenStack Integration Tests
        run: bash ./script/integration-suites/key-manager
        env:
          DEVSTACK_PATH: ${{ github.workspace }}/devstack
          PACKAGE: "./integration"
          OS_BRANCH: ${{ matrix.openstack_version }}
      - name: Generate logs on failure
        run: ./script/collectlogs
        if: failure()
      - name: Upload logs artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-keymanager-${{ matrix.name }}-${{ github.run_id }}
          path: /tmp/devstack-logs/*
